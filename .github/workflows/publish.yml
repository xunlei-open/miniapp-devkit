name: Publish packages

on:
  push:
    tags:
      - 'v*-beta*'
  release:
    types: [published]

permissions: {}

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'push' && github.event.deleted == false) ||
      (github.event_name == 'release' && github.event.release.prerelease == false)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      dist-tag: ${{ steps.validate.outputs.dist-tag }}
      version: ${{ steps.validate.outputs.version }}

    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release tag and source commit
        id: validate
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/validate-release.sh

      - name: Verify packages
        run: pnpm verify

      - name: Pack publishable packages
        run: pnpm --recursive --filter './packages/*' pack --pack-destination "$RUNNER_TEMP/npm-packages"

      - name: Upload packages
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages/*.tgz
          if-no-files-found: error

  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install publishing tools
        run: npm install --global npm@11.12.1

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          path: ${{ runner.temp }}/npm-packages
          merge-multiple: true

      - name: Publish to npm with OIDC
        env:
          NPM_DIST_TAG: ${{ needs.prepare.outputs.dist-tag }}
          PACKAGE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: bash .github/scripts/publish-packages.sh
